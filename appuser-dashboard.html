<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AppUser Dashboard</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>
    <!-- Header -->
    <header class="dashboard-header">
        <h2>Welcome, <span id="userName">User</span></h2>
        <button class="logout-btn" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
    </header>
    <div class="active-booking-wrapper">

        <button id="prevBooking" class="booking-nav">&#10094;</button>

        <div class="booking-slider">

            <div id="currentBookingCard" class="active-booking-card">

                <div class="booking-card-header">
                    <h3>Active Bookings</h3>
                    <span id="cbStatus" class="booking-status"></span>
                </div>

                <div class="booking-details">

                    <div class="booking-row">
                        <span class="label">Vehicle</span>
                        <span id="cbVehicle"></span>
                    </div>

                    <div class="booking-row">
                        <span class="label">Vehicle Type</span>
                        <span id="cbVehicleType"></span>
                    </div>

                    <div class="booking-row">
                        <span class="label">Engine Capacity</span>
                        <span id="cbEngine"></span>
                    </div>

                    <div class="booking-row">
                        <span class="label">Started</span>
                        <span id="cbStarted"></span>
                    </div>

                    <div class="booking-row">
                        <span class="label">Amount</span>
                        <span>₹ <span id="cbAmount"></span></span>
                    </div>

                    <div class="booking-row">
                        <span class="label">Payment</span>
                        <span id="cbPayment"></span>
                    </div>
                    <div class="booking-actions">
                        <button id="payNowBtn" class="pay-btn">
                            Pay Now
                        </button>
                    </div>
                </div>

                <div class="booking-footer">
                    <span id="bookingCounter"></span>
                </div>
                <div class="booking-actions">
                    <button id="startJourneyBtn" class="journey-btn">
                        Start Journey
                    </button>
                </div>
            </div>

        </div>

        <button id="nextBooking" class="booking-nav">&#10095;</button>

    </div>

    <div class="dashboard-wrapper">



        <!-- Cards -->
        <div class="dashboard-grid">

            <div class="dashboard-card" id="addAddressCard" onclick="goToAddAddress()">
                <i class="fa-solid fa-location-dot"></i>
                <h3>Add Address</h3>
                <p>Add a new address</p>
            </div>

            <!-- PRIMARY ACTION -->
            <div class="dashboard-card primary-card" id="requestBookingCard" onclick="goToRequestBooking()">
                <i class="fa-solid fa-calendar-check"></i>
                <h3>Request Booking</h3>
                <p>Request a new booking</p>
            </div>

            <div class="dashboard-card" onclick="window.location.href='appuser-profile.html'">
                <i class="fa-solid fa-user"></i>
                <h3>Profile Info</h3>
                <p>View your profile details</p>
            </div>

            <div class="dashboard-card" id="bookingHistoryCard">
                <i class="fa-solid fa-book"></i>
                <h3>Booking History</h3>
                <p>View past bookings</p>
            </div>

            <div class="dashboard-card" onclick="window.location.href='appuser-add-vehicle.html'">
                <i class="fa-solid fa-car"></i>
                <h3>Add Vehicle</h3>
                <p>Register a new vehicle</p>
            </div>

        </div>

    </div>

    <script src="js/appuser.dashboard.js"></script>
</body>

</html>
